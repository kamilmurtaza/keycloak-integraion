spring.application.name=rftec.keycloak

# --- Server Configuration ---
server.port=8081

# --- OAuth2 / Keycloak Configuration ---
spring.security.oauth2.client.registration.keycloak.client-id=rftech_app
spring.security.oauth2.client.registration.keycloak.client-secret=JG5LnIY2nI7I0lo3pjflEkoF8FSx6tuE
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8080/realms/rftech_realm

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/rftech_realm


# --- Optional: Logging for debugging ---
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG